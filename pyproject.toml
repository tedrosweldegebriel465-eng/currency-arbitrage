[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "currency-arbitrage"
version = "1.0.0"
description = "Bellman-Ford currency arbitrage research system using -log(rate) graph weights."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Currency Arbitrage Detector contributors" }]
keywords = ["arbitrage", "bellman-ford", "forex", "graphs"]
dependencies = [
    "numpy>=1.21.0",
    "networkx>=2.8.0",
    "matplotlib>=3.5.0",
    "pandas>=1.4.0",
    "requests>=2.28.0",
    "openpyxl>=3.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "mypy>=1.8.0",
]

[project.scripts]
currency-arbitrage = "main:main"

[tool.setuptools.packages.find]
# Discovers currency_arbitrage/* and advanced_features/*
include = ["currency_arbitrage*", "advanced_features*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["currency_arbitrage", "advanced_features", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.10"
packages = ["currency_arbitrage", "advanced_features"]
ignore_missing_imports = true
warn_unused_ignores = true
